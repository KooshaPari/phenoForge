# Cargo-deny configuration for phenotype-forge

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
]
[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "warn"
[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"

[advisories]
ignore = []
