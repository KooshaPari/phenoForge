[package]
name = "phenotype-forge"
version = "0.1.0"
edition = "2021"
license = "MIT-or-Apache-2.0"
description = "phenoForge — Phenotype build/codegen tooling: cargo-keyword audit, worktree-aware scaffolding, file-watcher driven orchestration"
homepage = "https://github.com/KooshaPari/phenoForge"
documentation = "https://docs.rs/phenotype-forge"
repository = "https://github.com/KooshaPari/phenoForge"
readme = "README.md"

[workspace]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
notify = "6.0"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[[bin]]
name = "phenotype-forge"
path = "src/main.rs"
